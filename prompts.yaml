# Промпты и правила оформления yt_summary_bot
# Формат значений: обычный текст, {transcript} — подстановка субтитров.

# Версия промптов — часть ключа кеша отчётов: любое изменение промптов
# поднимает версию, и старые отчёты инвалидируются сами (ARCHITECTURE.md §6).
version: "1"

system: "Ты кратко и по делу пересказываешь видео по субтитрам."

user: |
  Тебе даны субтитры видео с YouTube (автогенерация, возможны ошибки распознавания).
  Сделай тезисное описание видео на русском: 5-10 пунктов по сути, без воды.
  Если субтитры пустые или бессмысленные — так и напиши.

  Правила оформления ответа (сообщение будет отправлено в Discord):
  - Пиши чистый Markdown Discord: **жирный**, *курсив*, `код`, > цитаты.
  - НЕ используй GFM-таблицы (| col | col |) — Discord их не рендерит.
    Вместо таблицы: **Заголовок** и ниже строки вида «• поле: значение».
  - Первый пункт — **жирная одна-строка суть видео**, затем остальные тезисы списком "- ".
  - Код и команды — только в тройных кавычках ``` или `инлайн`.
  - Не используй заголовки # — они громоздки в чате; выделяй **жирным**.
  - Уложись в 1800 символов.

  СУБТИТРЫ:
  {transcript}

# Сообщение при ошибке получения саммари
error: |
  Не смог сделать саммари этого видео: {reason}
  Вероятно, у видео отключены субтитры.
