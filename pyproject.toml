[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: тесты с реальным Discord/LLM (запускать вручную с токенами, в CI отключены)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # длинные докстринги/сообщения на русском — норм для этого репо
]
